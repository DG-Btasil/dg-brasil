name: Worker de agentes

on:
  pull_request:
    paths: ["apps/agentes/**", "supabase/**", ".github/workflows/agentes.yml"]
  push:
    branches: [main, master]
    paths: ["apps/agentes/**", "supabase/**", ".github/workflows/agentes.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agentes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/agentes/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

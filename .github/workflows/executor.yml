name: Conector (executor)

# O conector roda só no computador do escritório, que é Windows: por isso os
# testes rodam em Windows (há caminhos e regras próprias do sistema).

on:
  pull_request:
    paths: ["apps/executor/**", ".github/workflows/executor.yml"]
  push:
    branches: [main, master]
    paths: ["apps/executor/**", ".github/workflows/executor.yml"]

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/executor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
